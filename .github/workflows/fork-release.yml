name: Fork release

# Builds this fork's releases and attaches them to a draft GitHub Release.
# Upstream's CI workflow publishes to upstream's S3 bucket and Docker Hub
# namespace, which this repository has no credentials for.
#
# The CI workflow (main.yml) calls this once its tests have passed for a tag of
# the form v<upstream version>-r<n>, e.g. v4.20.0-r1 is the first fork release
# based on upstream v4.20.0. It has no trigger of its own, so assets are never
# built from a commit whose tests failed.
on:
  workflow_call:

env:
  CARGO_INCREMENTAL: 0

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        database:
          - postgres
          - sqlite
    env:
      DATABASE: ${{ matrix.database }}
      TAG: ${{ github.ref_name }}
    steps:
      -
        name: Remove pre-installed software
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet \
                       /usr/local/lib/android \
                       /opt/ghc \
                       /usr/local/share/boost \
                       "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set fork version
        # The fork release number goes into the package version as semver build
        # metadata (tag v4.20.0-r1 -> 4.20.0+r1), so the binary reports it and
        # cargo-deb writes the Debian version 4.20.0+r1-1. dpkg sorts that above
        # upstream's 4.20.0-1 and below its next release, so the fork package
        # wins over the same upstream version. A "-r1" suffix would instead be a
        # semver pre-release, which cargo-deb writes as 4.20.0~r1-1 and dpkg sorts
        # below upstream's 4.20.0-1. Cargo also ignores build metadata when
        # matching version requirements, so path dependencies pinned to the
        # upstream version keep resolving.
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(r[0-9]+)$ ]]; then
            echo "::error::Tag $TAG does not match v<major>.<minor>.<patch>-r<n>"
            exit 1
          fi
          BASE="${BASH_REMATCH[1]}"
          BASE_RE="${BASE//./\\.}"
          VERSION="$BASE+${BASH_REMATCH[2]}"

          CURRENT=$(sed -n '/^\s*\[workspace.package\]/,/^\s*\[/ s/^\s*version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$CURRENT" != "$BASE" ]; then
            echo "::error::Tag $TAG is for upstream $BASE, but Cargo.toml is at $CURRENT"
            exit 1
          fi

          sed -i "/^\s*\[workspace.package\]/,/^\s*\[/ s/^\(\s*version = \)\"$BASE_RE\"/\1\"$VERSION\"/" Cargo.toml
          grep -n "\"$VERSION\"" Cargo.toml
      -
        name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      -
        name: Build UI
        run: nix-shell --command "make build-ui"
      -
        name: Build distributables
        run: nix-shell --command "make dist"
      -
        name: Rename packages
        # Name the files after the tag (chirpstack_4.20.0-r1_amd64.deb) like the
        # earlier fork releases, rather than cargo-deb's 4.20.0+r1-1: a "+" in a
        # release asset URL gets URL-encoded. dpkg orders packages by the Version
        # field inside the .deb, not by the file name.
        run: |
          VERSION="${TAG#v}"
          cd dist
          for f in *.deb; do
            new="${f%%_*}_${VERSION}_${f##*_}"
            [ "$f" = "$new" ] || mv -v "$f" "$new"
          done
          for f in *.tar.gz; do
            new="${f/"+r"/-r}"
            [ "$f" = "$new" ] || mv -v "$f" "$new"
          done
          ls -la
      -
        name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.database }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      -
        name: Download distributables
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      -
        name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      -
        name: Create draft release
        # A draft, so the notes and assets can be reviewed before publishing.
        # Re-running replaces the assets.
        run: |
          BASE="${TAG%-r*}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes "Based on upstream ChirpStack [$BASE](https://github.com/chirpstack/chirpstack/releases/tag/$BASE)."
          fi
